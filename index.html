<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Workshop Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <h1>Student Workshop Registration</h1>

        <p class="intro">
            Register for your preferred workshop by completing the form below.
        </p>

        <form action="process.php" method="post">

            <div class="form-group">
                <label for="studentName">Full Name</label>
                <input
                    type="text"
                    id="studentName"
                    name="studentName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="Enter your student ID"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="workshop">Select Workshop</label>
                <select id="workshop" name="workshop" required>
                    <option value="">-- Select a Workshop --</option>
                    <option value="HTML and CSS Basics">
                        HTML and CSS Basics
                    </option>
                    <option value="JavaScript Interaction">
                        JavaScript Interaction
                    </option>
                    <option value="PHP Form Processing">
                        PHP Form Processing
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">What do you want to learn?</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your learning expectations..."
                ></textarea>
            </div>

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
